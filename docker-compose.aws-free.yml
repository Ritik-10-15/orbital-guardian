services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-orbital_guardian}"
      POSTGRES_USER: "${POSTGRES_USER:-orbital}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.aws}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-orbital}:${DB_PASSWORD:?Set DB_PASSWORD in .env.aws}@db:5432/${POSTGRES_DB:-orbital_guardian}"
      ALLOW_LOCAL_STATE_IMPORT: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-orbital}:${DB_PASSWORD:?Set DB_PASSWORD in .env.aws}@db:5432/${POSTGRES_DB:-orbital_guardian}"
      ALLOW_LOCAL_STATE_IMPORT: "${ALLOW_LOCAL_STATE_IMPORT:-false}"
      PUBLIC_READ_ONLY: "${PUBLIC_READ_ONLY:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      SPACETRACK_USER: "${SPACETRACK_USER:-}"
      SPACETRACK_PASS: "${SPACETRACK_PASS:-}"
      CELESTRAK_USER_AGENT: "${CELESTRAK_USER_AGENT:-OrbitalGuardian/1.0 (educational project)}"
      MAX_DEBRIS_OBJECTS: "${MAX_DEBRIS_OBJECTS:-200}"
    volumes:
      - tle_cache:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_READ_ONLY: "${VITE_PUBLIC_READ_ONLY:-false}"
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  tle_cache:
