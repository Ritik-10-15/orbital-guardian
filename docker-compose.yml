services:

  db:
    image: postgres:16-alpine
    container_name: orbital-guardian-db
    environment:
      POSTGRES_DB: orbital_guardian
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: orbital_local_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbital-guardian-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital -d orbital_guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbital-guardian-migrate
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://orbital:orbital_local_dev@db:5432/orbital_guardian
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbital-guardian-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://orbital:orbital_local_dev@db:5432/orbital_guardian
    volumes:
      - ./backend/data:/app/data   # persist TLE cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbital-guardian-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: orbital-guardian-net

volumes:
  orbital-guardian-postgres:
